name: DeployPlatoformServerHml

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release on Merge"]
    types:
      - completed
    branches:
      - dev

env:
  AWS_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID_HML }}
  AWS_REGION: sa-east-1
  DOCKERHUB_ORGANIZATION: devupbet
  DOCKERHUB_REPOSITORY: platform-server
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  EKS_CLUSTER: cluster-hml
  EKS_NAMESPACE: platform
  EKS_DEPLOYMENT: platform-server-deployment
  EKS_CONTAINER: platform-server

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # For manual dispatch, use the ref name
            VERSION="${{ github.ref_name }}"
          else
            # For workflow_run, get the latest tag
            VERSION=$(git describe --tags --abbrev=0)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version to deploy: $VERSION"
      - name: Check if Docker image exists
        uses: cloudposse/github-action-docker-image-exists@main
        with:
          registry: registry.hub.docker.com
          organization: "${{ env.DOCKERHUB_ORGANIZATION }}"
          repository: "${{ env.DOCKERHUB_REPOSITORY }}"
          login: '${{ env.DOCKERHUB_USERNAME }}'
          password: '${{ env.DOCKERHUB_PASSWORD }}'
          tag: ${{ env.VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-pipeline
          role-session-name: github-pipeline

      - name: Update kubeconfig
        id: kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Deploy server to EKS
        run: |
          kubectl config set-context --current --namespace=${{ env.EKS_NAMESPACE }}
          kubectl set image deployment/${{ env.EKS_DEPLOYMENT }} ${{ env.EKS_CONTAINER }}=${{ env.DOCKERHUB_ORGANIZATION }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ env.VERSION }}
          kubectl rollout status deployment/${{ env.EKS_DEPLOYMENT }}

      - name: Restart Deployment
        run: |
          kubectl config set-context --current --namespace=${{ env.EKS_NAMESPACE }}
          kubectl rollout restart deployment/${{ env.EKS_DEPLOYMENT }}
