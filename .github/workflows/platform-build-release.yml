name: PlatformBuildRelease

on:
  release:
    types:
      - created

env:
  VERSION: ${{ github.ref_name }}
  DOCKERHUB_ORGANIZATION: devupbet
  DOCKERHUB_SERVER_REPOSITORY: platform-server
  DOCKERHUB_SERVER_DASH_REPOSITORY: platform-server-dash
  DOCKERHUB_CONSUMER_SERVICE_REPOSITORY: platform-consumer
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Build and Push Server Image
        run: |
          docker build -t ${{ env.DOCKERHUB_ORGANIZATION }}/${{ env.DOCKERHUB_SERVER_REPOSITORY }}:${{ env.VERSION }} -f apps/server/Dockerfile . --push

  build-server-dash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Build and Push Server Dash Image
        run: |
          docker build -t ${{ env.DOCKERHUB_ORGANIZATION }}/${{ env.DOCKERHUB_SERVER_DASH_REPOSITORY }}:${{ env.VERSION }} -f apps/server-dash/Dockerfile . --push

  build-consumer-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Image
        run: |
          docker buildx build --platform linux/arm64,linux/amd64 \
          -t ${{ env.DOCKERHUB_ORGANIZATION }}/${{ env.DOCKERHUB_CONSUMER_SERVICE_REPOSITORY }}:${{ env.VERSION }} -f apps/consumer-service/Dockerfile . --push
